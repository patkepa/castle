name: CastleMobile

options:
  bundleIdPrefix: app.castle
  deploymentTarget:
    iOS: "17.0"
  developmentLanguage: en
  xcodeVersion: "26.0"

settings:
  base:
    SWIFT_VERSION: "6.0"
    GENERATE_INFOPLIST_FILE: NO
    CURRENT_PROJECT_VERSION: 1
    MARKETING_VERSION: 0.1.0

targets:
  CastleMobile:
    type: application
    platform: iOS
    sources:
      - path: CastleMobile
        excludes:
          - Resources/Info.plist
          - Resources/Fixture
      - path: CastleMobile/Resources/Fixture
        type: folder
        buildPhase: resources
    info:
      path: CastleMobile/Resources/Info.plist
      properties:
        CFBundleDisplayName: Castle
        UILaunchScreen: {}
        UISupportedInterfaceOrientations:
          - UIInterfaceOrientationPortrait
          - UIInterfaceOrientationLandscapeLeft
          - UIInterfaceOrientationLandscapeRight
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: app.castle.mobile
        CODE_SIGN_STYLE: Automatic
        TARGETED_DEVICE_FAMILY: "1,2"
        SUPPORTS_MACCATALYST: NO

  CastleMobileTests:
    type: bundle.unit-test
    platform: iOS
    sources:
      - path: CastleMobileTests
    dependencies:
      - target: CastleMobile
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: app.castle.mobile.tests
        GENERATE_INFOPLIST_FILE: YES

schemes:
  CastleMobile:
    build:
      targets:
        CastleMobile: all
        CastleMobileTests: [test]
    test:
      targets:
        - CastleMobileTests
